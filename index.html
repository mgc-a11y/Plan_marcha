<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nutri_bici</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 16px; line-height: 1.5; }
    #resultado { margin-top: 1.5rem; font-size: 1.15rem; }
    .error { color: #b00020; }
    .nota { color: #555; font-size: 0.9rem; }
    #perfil svg { width: 100%; height: auto; display: block; }
    #perfil .rejilla { stroke: #e3e3e3; stroke-width: 1; }
    #perfil .eje { font-size: 12px; fill: #666; }
    #perfil .area { fill: #d6ecd2; }
    #perfil .linea { fill: none; stroke: #2e7d32; stroke-width: 2; stroke-linejoin: round; }
    #perfil circle.alto { fill: #c62828; stroke: #fff; stroke-width: 2; }
    #perfil circle.bajo { fill: #1565c0; stroke: #fff; stroke-width: 2; }
    #perfil .etiqueta { font-size: 14px; font-weight: 600; paint-order: stroke; stroke: #fff; stroke-width: 4px; }
    #perfil .etiqueta.alto { fill: #c62828; }
    #perfil .etiqueta.bajo { fill: #1565c0; }
    .leyenda { font-size: 0.95rem; }
    fieldset { border: 1px solid #ccc; border-radius: 8px; margin: 1.5rem 0; padding: 0.5rem 1rem 1rem; }
    .campos { display: flex; flex-wrap: wrap; gap: 1rem; }
    .campos label { display: flex; flex-direction: column; font-size: 0.95rem; flex: 1 1 8rem; }
    .campos input, .campos select { font-size: 1.1rem; padding: 0.3rem; margin-top: 0.2rem; }
    .campos + .campos, #bloquePotencia { margin-top: 1rem; }
    [hidden] { display: none !important; }
    #ritmo .grande { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.3rem; }
    #ritmo table { border-collapse: collapse; width: 100%; margin: 0.8rem 0; }
    #ritmo th, #ritmo td { text-align: right; padding: 0.3rem 0.5rem; border-bottom: 1px solid #e3e3e3; }
    #ritmo td { white-space: nowrap; }
    #ritmo th:first-child, #ritmo td:first-child { text-align: left; white-space: normal; }
    details { margin-top: 0.8rem; font-size: 0.9rem; color: #444; }
  </style>
</head>
<body>
  <h1>Hola, grupeta</h1>

  <label for="archivo">Elige tu archivo GPX:</label><br>
  <!-- Filtro pensado para el iPhone: con solo ".gpx" deja los archivos en gris,
       y sin filtro ofrece fotos y cámara. "application/octet-stream" (cualquier
       archivo de datos) intenta que solo salga "Seleccionar archivo".
       Si el archivo no es un GPX, gpx.js lo detecta y avisa. -->
  <input type="file" id="archivo" accept=".gpx,application/gpx+xml,application/xml,text/xml,application/octet-stream">

  <fieldset>
    <legend>Tus datos</legend>
    <div class="campos">
      <label>Calcular el tiempo con
        <select id="modo">
          <option value="potencia" selected>Mi potencia (FTP)</option>
          <option value="velocidad">Una velocidad media</option>
        </select>
      </label>
      <label>Hidratos (g por hora)
        <input type="number" id="hidratos" inputmode="numeric" min="0" max="200" step="1" value="60">
      </label>
    </div>

    <div class="campos" id="bloqueVelocidad" hidden>
      <label>Velocidad media (km/h)
        <input type="number" id="velocidad" inputmode="decimal" min="5" max="60" step="0.1">
      </label>
    </div>

    <div id="bloquePotencia">
    <div class="campos">
      <label>FTP (vatios)
        <input type="number" id="ftp" inputmode="numeric" min="50" max="700" step="1">
      </label>
      <label>Peso (kg)
        <input type="number" id="peso" inputmode="decimal" min="30" max="200" step="0.1">
      </label>
    </div>
    <div class="campos">
      <label>Intensidad en subida (% del FTP)
        <select id="pctSubida"></select>
      </label>
      <label>Intensidad en llano (% del FTP)
        <select id="pctLlano"></select>
      </label>
      <label>¿Cómo bajas?
        <select id="bajador">
          <option value="bueno">Buen bajador (máx. 75 km/h)</option>
          <option value="medio" selected>Bajador medio (máx. 65 km/h)</option>
          <option value="malo">Mal bajador (máx. 55 km/h)</option>
        </select>
      </label>
    </div>
    </div>
  </fieldset>

  <p id="resultado" aria-live="polite"></p>
  <div id="perfil"></div>
  <div id="ritmo" aria-live="polite"></div>

  <p class="nota">Tu GPX no sale de tu dispositivo: todo se calcula en este navegador.</p>

  <script src="gpx.js"></script>
  <script src="perfil.js"></script>
  <script src="ritmo.js"></script>
  <script>
    var entrada = document.getElementById("archivo");
    var salida = document.getElementById("resultado");
    var dibujo = document.getElementById("perfil");
    var cajaRitmo = document.getElementById("ritmo");
    var campoFtp = document.getElementById("ftp");
    var campoPeso = document.getElementById("peso");
    var campoHidratos = document.getElementById("hidratos");
    var campoPctSubida = document.getElementById("pctSubida");
    var campoPctLlano = document.getElementById("pctLlano");
    var campoBajador = document.getElementById("bajador");
    var campoModo = document.getElementById("modo");
    var campoVelocidad = document.getElementById("velocidad");
    var bloquePotencia = document.getElementById("bloquePotencia");
    var bloqueVelocidad = document.getElementById("bloqueVelocidad");
    var ultimaRuta = null;

    // Es uno u otro: solo se ven los campos del modo elegido.
    function cambiarModo() {
      var porVelocidad = campoModo.value === "velocidad";
      bloqueVelocidad.hidden = !porVelocidad;
      bloquePotencia.hidden = porVelocidad;
      mostrarRitmo();
    }

    // Opciones de intensidad: del 50 % al 100 % del FTP, de 5 en 5.
    [[campoPctSubida, SUPUESTOS.fraccionSubida], [campoPctLlano, SUPUESTOS.fraccionLlano]].forEach(function (par) {
      for (var p = 50; p <= 100; p += 5) {
        var op = document.createElement("option");
        op.value = p;
        op.textContent = p + " %";
        if (p === Math.round(par[1] * 100)) op.selected = true;
        par[0].appendChild(op);
      }
    });

    function num(n, decimales) {
      return n.toLocaleString("es-ES", { minimumFractionDigits: decimales, maximumFractionDigits: decimales });
    }

    function elemento(etiqueta, texto, clase) {
      var el = document.createElement(etiqueta);
      if (texto !== undefined) el.textContent = texto;
      if (clase) el.className = clase;
      return el;
    }

    // Lee un número del formulario. Devuelve null si está vacío o fuera de rango.
    function leerCampo(campo, minimo, maximo) {
      var v = parseFloat(String(campo.value).replace(",", "."));
      if (isNaN(v) || v < minimo || v > maximo) return null;
      return v;
    }

    function mostrarRitmo() {
      cajaRitmo.textContent = "";
      if (!ultimaRuta) return;

      var hidratos = leerCampo(campoHidratos, 0, 200);
      var faltan = [];

      if (campoModo.value === "velocidad") {
        var velocidad = leerCampo(campoVelocidad, 5, 60);
        if (velocidad === null) faltan.push("tu velocidad media (entre 5 y 60 km/h)");
        if (hidratos === null) faltan.push("los gramos de hidratos por hora (entre 0 y 200)");
        if (faltan.length) {
          cajaRitmo.appendChild(elemento("p", "Para calcular el tiempo, escribe " + faltan.join(", ") + "."));
          return;
        }
        var ev = estimarPorVelocidad(ultimaRuta, { velocidadKmh: velocidad, gramosHora: hidratos });
        cajaRitmo.appendChild(elemento("p", "Tiempo estimado: " + formatoDuracion(ev.segundosTotales) + " (sin paradas)", "grande"));
        cajaRitmo.appendChild(elemento("p",
          num(ultimaRuta.distanciaKm, 1) + " km a " + num(velocidad, 1) + " km/h de media. " +
          "No se usan la potencia, el peso ni las cuestas."));
        cajaRitmo.appendChild(elemento("p",
          "Hidratos: " + num(hidratos, 0) + " g/h × " + num(ev.segundosTotales / 3600, 1) + " h = " +
          num(Math.round(ev.hidratosTotalesG), 0) + " g en total."));
        return;
      }

      var ftp = leerCampo(campoFtp, 50, 700);
      var peso = leerCampo(campoPeso, 30, 200);
      if (ftp === null) faltan.push("tu FTP (entre 50 y 700 W)");
      if (peso === null) faltan.push("tu peso (entre 30 y 200 kg)");
      if (hidratos === null) faltan.push("los gramos de hidratos por hora (entre 0 y 200)");
      if (faltan.length) {
        cajaRitmo.appendChild(elemento("p", "Para calcular el tiempo, escribe " + faltan.join(", ") + "."));
        return;
      }

      var pctSubida = parseInt(campoPctSubida.value, 10);
      var pctLlano = parseInt(campoPctLlano.value, 10);
      var bajador = campoBajador.value;
      var e = estimarRuta(ultimaRuta, {
        ftp: ftp, pesoKg: peso, gramosHora: hidratos,
        pctSubida: pctSubida, pctLlano: pctLlano, bajador: bajador
      });
      var horas = e.segundosTotales / 3600;

      cajaRitmo.appendChild(elemento("p", "Tiempo estimado: " + formatoDuracion(e.segundosTotales) + " (sin paradas)", "grande"));
      cajaRitmo.appendChild(elemento("p",
        "Velocidad media: " + num(e.velocidadMediaKmh, 1) + " km/h. Pedaleando a " +
        Math.round(e.potenciaSubidaW) + " W en subida (" + pctSubida + " % de tu FTP) y a " +
        Math.round(e.potenciaLlanoW) + " W en llano y bajada (" + pctLlano + " %)."));

      var tabla = elemento("table");
      var cab = elemento("tr");
      ["Tramos", "Km", "Tiempo", "Velocidad"].forEach(function (t) { cab.appendChild(elemento("th", t)); });
      tabla.appendChild(cab);
      [["subida", "Subida (más de 2 %)"], ["llano", "Llano (entre −2 % y 2 %)"], ["bajada", "Bajada (menos de −2 %)"]].forEach(function (g) {
        var d = e.grupos[g[0]];
        if (d.metros <= 0) return;
        var fila = elemento("tr");
        fila.appendChild(elemento("td", g[1]));
        fila.appendChild(elemento("td", num(d.metros / 1000, 1)));
        fila.appendChild(elemento("td", formatoDuracion(d.segundos)));
        fila.appendChild(elemento("td", num((d.metros / d.segundos) * 3.6, 1) + " km/h"));
        tabla.appendChild(fila);
      });
      cajaRitmo.appendChild(tabla);

      cajaRitmo.appendChild(elemento("p",
        "Hidratos: " + num(hidratos, 0) + " g/h × " + num(horas, 1) + " h = " +
        num(Math.round(e.hidratosTotalesG), 0) + " g en total."));

      var sup = elemento("details");
      sup.appendChild(elemento("summary", "Supuestos del cálculo"));
      var lista = elemento("ul");
      [
        "Subida: tramos de más del 2 %. Bajada: de menos del −2 %. El resto es llano.",
        "En las bajadas se pedalea con la intensidad de llano, hasta tu velocidad máxima (" + e.velocidadMaxKmh + " km/h).",
        "En bajadas suaves el aire frena antes de llegar a ese máximo.",
        "Bici y equipo: " + SUPUESTOS.pesoBiciKg + " kg (masa total " + num(e.masaKg, 1) + " kg).",
        "Postura con las manos en las manetas (CdA " + num(SUPUESTOS.cda, 2) + " m²), asfalto (rodadura " + num(SUPUESTOS.crr, 3) + ").",
        "Aire a nivel del mar y 15 °C. Sin viento.",
        "Sin paradas.",
        "Es una estimación, no un objetivo. Modelo: Martin et al. (1998)."
      ].forEach(function (t) { lista.appendChild(elemento("li", t)); });
      sup.appendChild(lista);
      cajaRitmo.appendChild(sup);
    }

    [campoFtp, campoPeso, campoHidratos, campoVelocidad].forEach(function (c) {
      c.addEventListener("input", mostrarRitmo);
    });
    campoModo.addEventListener("change", cambiarModo);
    [campoPctSubida, campoPctLlano, campoBajador].forEach(function (c) {
      c.addEventListener("change", mostrarRitmo);
    });

    // Si cambia el ancho de la ventana (o giras el móvil), se vuelve a dibujar.
    var anchoAnterior = dibujo.clientWidth;
    window.addEventListener("resize", function () {
      if (ultimaRuta && dibujo.clientWidth !== anchoAnterior) {
        anchoAnterior = dibujo.clientWidth;
        dibujarPerfil(dibujo, ultimaRuta);
      }
    });

    entrada.addEventListener("change", function () {
      var archivo = entrada.files[0];
      if (!archivo) return;
      archivo.text().then(function (texto) {
        try {
          var r = analizarGpx(texto);
          salida.className = "";
          salida.textContent = resumenEnPalabras(r);
          ultimaRuta = r;
          dibujarPerfil(dibujo, r);
        } catch (e) {
          salida.className = "error";
          salida.textContent = e.message;
          ultimaRuta = null;
          dibujo.textContent = "";
        }
        mostrarRitmo();
      });
    });
  </script>
</body>
</html>
